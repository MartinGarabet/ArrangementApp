<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Arrangement-app</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        input { display: block; margin: 8px 0; padding: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 16px; margin-top: 8px; }
        .event { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>

<h1>Arrangementer</h1>

<h2>Innloggingstoken</h2>
<p>Lim inn token fra <code>/auth/login</code> (midlertidig løsning):</p>
<input type="text" id="tokenInput" placeholder="JWT token her">
<button onclick="saveToken()">Lagre token</button>

<h2>Opprett nytt arrangement</h2>
<input type="text" id="titleInput" placeholder="Tittel">
<input type="number" id="capacityInput" placeholder="Kapasitet">
<button onclick="handleCreateEvent()">Opprett</button>

<h2>Alle arrangementer</h2>
<button onclick="loadEvents()">Oppdater liste</button>
<div id="eventList"></div>

<script>
    function saveToken() {
        const token = document.getElementById('tokenInput').value;
        localStorage.setItem('jwtToken', token);
        alert('Token lagret');
    }

    function getToken() {
        return localStorage.getItem('jwtToken');
    }

    async function loadEvents() {
        const response = await fetch('/events', {
            headers: {
                'Authorization': 'Bearer ' + getToken()
            }
        });

        if (!response.ok) {
            document.getElementById('eventList').innerText = 'Kunne ikke hente arrangementer. Er du logget inn?';
            return;
        }

        const events = await response.json();

        const listDiv = document.getElementById('eventList');
        listDiv.innerHTML = '';

        events.forEach(event => {
            const div = document.createElement('div');
            div.className = 'event';
            div.innerText = event.title + ' (kapasitet: ' + event.capacity + ')';
            listDiv.appendChild(div);
        });
    }

    async function handleCreateEvent() {
        const title = document.getElementById('titleInput').value;
        const capacity = document.getElementById('capacityInput').value;

        const response = await fetch('/events', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({ title: title, capacity: parseInt(capacity) })
        });

        if (response.ok) {
            loadEvents();
        } else {
            alert('Kunne ikke opprette arrangement. Sjekk at du har lagret et gyldig token.');
        }
    }
</script>

</body>
</html>
