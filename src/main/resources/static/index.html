<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Arrangement-app</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        input { display: block; margin: 8px 0; padding: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 16px; margin-top: 8px; }
        .event { border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>

<h1>Arrangementer</h1>
<h2>Registrer ny bruker</h2>
<input type="text" id="registerName" placeholder="Navn">
<input type="email" id="registerEmail" placeholder="E-post">
<input type="password" id="registerPassword" placeholder="Passord">
<button onclick="handleRegister()">Registrer</button>

<h2>Logg inn</h2>
<input type="email" id="loginEmail" placeholder="E-post">
<input type="password" id="loginPassword" placeholder="Passord">
<button onclick="handleLogin()">Logg inn</button>
<p id="loginStatus"></p>

<h2>Opprett nytt arrangement</h2>
<input type="text" id="titleInput" placeholder="Tittel">
<input type="number" id="capacityInput" placeholder="Kapasitet">
<button onclick="handleCreateEvent()">Opprett</button>

<h2>Alle arrangementer</h2>
<button onclick="loadEvents()">Oppdater liste</button>
<div id="eventList"></div>

<script>
    function saveToken() {
        const token = document.getElementById('tokenInput').value;
        localStorage.setItem('jwtToken', token);
        alert('Token lagret');
    }

    function getToken() {
        return localStorage.getItem('jwtToken');
    }

    async function loadEvents() {
        const response = await fetch('/events', {
            headers: {
                'Authorization': 'Bearer ' + getToken()
            }
        });

        if (!response.ok) {
            document.getElementById('eventList').innerText = 'Kunne ikke hente arrangementer. Er du logget inn?';
            return;
        }

        const events = await response.json();

        const listDiv = document.getElementById('eventList');
        listDiv.innerHTML = '';

        events.forEach(event => {
            const div = document.createElement('div');
            div.className = 'event';
            div.innerHTML = event.title + ' (kapasitet: ' + event.capacity + ') ' +
                '<button onclick="handleRegisterForEvent(' + event.id + ')">Meld meg på</button>';
            listDiv.appendChild(div);
        });
    }

    async function handleCreateEvent() {
        const title = document.getElementById('titleInput').value;
        const capacity = document.getElementById('capacityInput').value;

        const response = await fetch('/events', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({ title: title, capacity: parseInt(capacity) })
        });

        if (response.ok) {
            loadEvents();
        } else {
            alert('Kunne ikke opprette arrangement. Sjekk at du har lagret et gyldig token.');
        }
    }

    async function handleRegister() {
        const name = document.getElementById('registerName').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;

        const response = await fetch('/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, email: email, password: password })
        });

        if (response.ok) {
            alert('Registrert! Du kan nå logge inn.');
        } else {
            alert('Registrering feilet. Kanskje e-posten er i bruk?');
        }
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('jwtToken', data.token);
            document.getElementById('loginStatus').innerText = 'Innlogget!';
            loadEvents();
        } else {
            document.getElementById('loginStatus').innerText = 'Feil e-post eller passord.';
        }
    }

    async function handleRegisterForEvent(eventId) {
        const name = prompt('Navnet ditt:');
        const email = prompt('E-posten din:');

        const response = await fetch('/events/' + eventId + '/registrations', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken()
            },
            body: JSON.stringify({ participantName: name, participantEmail: email })
        });

        if (response.ok) {
            alert('Påmeldt!');
        } else {
            alert('Påmelding feilet. Er du logget inn?');
        }
    }
</script>

</body>
</html>
