services:
  db:
    image: postgres:16
    container_name: arrangement-db
    environment:
      POSTGRES_DB: arrangement
      POSTGRES_USER: arrangement_user
      POSTGRES_PASSWORD: arrangement_pass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrangement_user -d arrangement"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: arrangement-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/arrangement
      SPRING_DATASOURCE_USERNAME: arrangement_user
      SPRING_DATASOURCE_PASSWORD: arrangement_pass
    ports:
      - "8080:8080"

volumes:
  db-data: